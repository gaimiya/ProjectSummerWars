<!DOCTYPE html>
<!-- 担当：指輪（画面）。変更する前に templates/README.md を読み、担当外の人は担当者に相談する -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('設定')}"></head>
<body>
<div class="app">
  <nav th:replace="~{fragments/layout :: nav('settings')}"></nav>
  <main class="main">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1>設定</h1>
    <p class="muted lead">Google のファイルは、サービスアカウント（README 参照）に「編集者」で共有してからURLを貼ってください。既存のフォーム・スプレッドシートも、そのまま使えます。</p>
    <form th:action="@{/settings}" method="post">
      <h2 class="section">勤怠シート</h2>
      <div class="card pad grid">
        <label>勤怠表のひな型（スプレッドシートURL）<input name="TEMPLATE_SHEET_URL" th:value="${v['TEMPLATE_SHEET_URL']}"><small>新しい社員の勤怠シートは、これをコピーして作ります。「テンプレ」シートが必要です</small></label>
        <label>社員フォルダを作る場所（フォルダURL）<input name="ROOT_FOLDER_URL" th:value="${v['ROOT_FOLDER_URL']}"></label>
        <label>退職者フォルダ（フォルダURL・任意）<input name="RETIRED_FOLDER_URL" th:value="${v['RETIRED_FOLDER_URL']}"><small>削除した社員のフォルダを移します</small></label>
      </div>

      <h2 class="section">交通費・経費フォーム</h2>
      <div class="card pad grid">
        <label>交通費フォーム（社員に配るURL）<input name="FORM_TRANSPORT_URL" th:value="${v['FORM_TRANSPORT_URL']}"></label>
        <label>交通費フォームの回答シート（スプレッドシートURL）<input name="FORM_TRANSPORT_SHEET_URL" th:value="${v['FORM_TRANSPORT_SHEET_URL']}"></label>
        <label>経費フォーム（社員に配るURL）<input name="FORM_EXPENSE_URL" th:value="${v['FORM_EXPENSE_URL']}"></label>
        <label>経費フォームの回答シート（スプレッドシートURL）<input name="FORM_EXPENSE_SHEET_URL" th:value="${v['FORM_EXPENSE_SHEET_URL']}"></label>
      </div>
      <p class="muted">回答シートには「社員番号」「利用日（日付）」「金額」の質問の列と、山本さんがチェックする「承認」列が必要です（承認の列はシートに自分で足します）。</p>

      <h2 class="section">社労士</h2>
      <div class="card pad grid">
        <label>社労士のメールアドレス<input name="MAIL_TO" type="email" th:value="${v['MAIL_TO']}"><small>月次集計のCSVを送る先</small></label>
      </div>
      <div style="margin-top:18px"><button class="btn">保存</button></div>
    </form>

    <h2 class="section">GAS 版からの切り替え（1回だけ）</h2>
    <form class="card pad" th:action="@{/settings/import}" method="post"
          onsubmit="return confirm('GAS 版の社員管理表から社員を取り込みます。すでにいる社員番号は飛ばします。よろしいですか？')">
      <label>GAS 版の「社員管理表」のURL<input name="sheetUrl" placeholder="https://docs.google.com/spreadsheets/d/…"><small>「社員一覧」「参画履歴」シートを読み、勤怠シート・フォルダ・共有状態をそのまま引き継ぎます。サービスアカウントに閲覧以上で共有してください</small></label>
      <div style="margin-top:12px"><button class="btn-outline">社員を取り込む</button></div>
    </form>
  </main>
</div>
</body>
</html>
