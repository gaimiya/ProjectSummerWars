<!DOCTYPE html>
<!-- 担当：指輪（画面）。変更する前に templates/README.md を読み、担当外の人は担当者に相談する -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('社員一覧')}"></head>
<body>
<div class="app">
  <nav th:replace="~{fragments/layout :: nav('employees')}"></nav>
  <main class="main">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="row between mb"><h1>社員一覧</h1><a class="btn" th:href="@{/employees/new}">＋ 社員を登録</a></div>
    <form class="row mb" th:action="@{/employees}" method="get">
      <input name="q" th:value="${q}" placeholder="氏名・フリガナ・社員番号で検索" style="max-width:360px">
      <select name="status" style="width:auto">
        <option th:each="s : ${ {'すべて','在籍','休職'} }" th:value="${s}" th:text="${s}" th:selected="${s == status}"></option>
      </select>
      <button class="btn-sub">絞り込む</button>
    </form>
    <div class="card table-wrap">
      <table class="table">
        <thead><tr><th>社員番号</th><th>氏名</th><th>所属</th><th>雇用形態</th><th>入社日</th><th>在籍</th><th>住宅手当</th><th>勤怠シート</th><th></th></tr></thead>
        <tbody>
        <tr th:each="e : ${list}">
          <td th:text="${e.employeeNo}"></td><td class="strong" th:text="${e.name}"></td><td th:text="${e.department}"></td>
          <td th:text="${e.employmentType}"></td><td th:text="${e.joinedOn}"></td>
          <td><span class="tag" th:classappend="${e.status == '休職'} ? 'wait' : 'ok'" th:text="${e.status}"></span></td>
          <td th:text="${#numbers.formatInteger(e.housingAllowance, 1, 'COMMA')} + '円'"></td>
          <td><span class="tag" th:classappend="${e.shareState == '共有済み'} ? 'ok' : (${e.shareState == '入社日に共有予定'} ? 'wait' : 'gray')" th:text="${e.shareState}"></span></td>
          <td><a class="btn-outline" th:href="@{/employees/{no}(no=${e.employeeNo})}">詳細</a></td>
        </tr>
        <tr th:if="${list.isEmpty()}"><td colspan="9" class="muted">該当する社員はいません。</td></tr>
        </tbody>
      </table>
    </div>
    <p class="muted" th:text="${list.size()} + '件を表示中'"></p>
  </main>
</div>
</body>
</html>
