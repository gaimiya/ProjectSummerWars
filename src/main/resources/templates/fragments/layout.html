<!DOCTYPE html>
<!-- 担当：指輪（画面）。変更する前に templates/README.md を読み、担当外の人は担当者に相談する -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<!-- 共通の頭と左メニュー。各画面で th:replace="~{fragments/layout :: head('タイトル')}" のように使う -->
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + '｜勤怠・給与集計'">勤怠・給与集計</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:fragment="nav(active)" class="side">
  <div class="side-title">勤怠・給与集計</div>
  <a th:href="@{/employees}" class="side-item" th:classappend="${active == 'employees'} ? 'on'">社員管理</a>
  <a th:href="@{/monthly}" class="side-item" th:classappend="${active == 'monthly'} ? 'on'">月次集計</a>
  <a th:href="@{/settings}" class="side-item" th:classappend="${active == 'settings'} ? 'on'">設定</a>
  <form th:action="@{/logout}" method="post" class="side-logout"><button class="link light">ログアウト</button></form>
</nav>
<div th:fragment="flash">
  <div class="toast" th:if="${message}" th:text="${message}"></div>
  <div class="err" th:if="${error}" th:text="${error}"></div>
  <div class="err" th:if="${errors}"><ul><li th:each="e : ${errors}" th:text="${e}"></li></ul></div>
</div>
</body>
</html>
