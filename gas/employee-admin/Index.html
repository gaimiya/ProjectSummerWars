<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F4F6F9;font-family:'Noto Sans JP',sans-serif;color:#1F2430;font-size:14px}
.app{display:flex;flex-wrap:wrap;min-height:100vh}
nav{flex:1 1 200px;max-width:220px;background:#1F2A3D;color:#fff;padding:20px 12px}
nav .t{font-weight:700;font-size:15px;padding:4px 10px 18px}
nav .i{border-radius:6px;padding:11px 12px;background:#33415C}
main{flex:999 1 560px;min-width:0;padding:28px 32px}
h1{margin:0;font-size:22px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{justify-content:space-between}
.mb{margin-bottom:16px}
button{font-family:inherit;font-size:14px;cursor:pointer;border-radius:6px;padding:10px 18px}
.btn{background:#1F5FC4;color:#fff;border:0;font-weight:500}
.btn:disabled{background:#8FA9D6;cursor:wait}
.sub{background:#fff;border:1px solid #C9CFD8;color:#1F2430}
.out{background:#fff;border:1px solid #1F5FC4;color:#1F5FC4;padding:6px 12px}
.danger{background:#fff;border:1px solid #B3261E;color:#B3261E}
.dangerFill{background:#B3261E;color:#fff;border:0}
.link{border:0;background:none;color:#1F5FC4;padding:0;margin-bottom:12px}
.pill{border:1px solid #C9CFD8;border-radius:999px;padding:7px 14px;background:#fff}
.pill.on{background:#1F5FC4;color:#fff;border-color:#1F5FC4}
input,select{font-family:inherit;font-size:14px;border:1px solid #C9CFD8;border-radius:6px;padding:9px 10px;background:#fff;width:100%}
input.bad{border-color:#B3261E;background:#FFF6F5}
.card{background:#fff;border:1px solid #E1E5EB;border-radius:10px}
.pad{padding:22px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px}
@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:20px}}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#4A5160}
label small{font-size:12px;color:#5A6170}
.req{color:#B3261E}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:860px}
td,th{padding:12px 14px;text-align:left;border-bottom:1px solid #E6E9EE}
th{background:#F7F8FA;color:#4A5160;font-weight:500}
.tag{padding:3px 10px;border-radius:999px;font-size:12px}
.ok{background:#E7F3EC;color:#1E5A36}.wait{background:#FFF4D6;color:#6B4E00}.gray{background:#ECEEF2;color:#4A5160}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid #D8DDE4;margin-bottom:18px}
.tab{border:0;background:none;padding:11px 16px;border-bottom:3px solid transparent;color:#4A5160;border-radius:0}
.tab.on{border-bottom-color:#1F5FC4;color:#1F5FC4;font-weight:700}
.toast{background:#E7F3EC;border:1px solid #9FCCB0;color:#1E5A36;border-radius:8px;padding:12px 16px;margin-bottom:18px}
.err{background:#FDECEA;border:1px solid #E6A19B;color:#8C1D18;border-radius:8px;padding:12px 16px;margin-bottom:18px}
.confirm{background:#FDECEA;border:1px solid #E6A19B;border-radius:10px;padding:16px 18px;margin-bottom:18px}
.muted{color:#5A6170;font-size:13px}
.hide{display:none}
</style>
</head>
<body>
<div class="app">
  <nav><div class="t">勤怠・給与集計</div><div class="i">社員管理</div></nav>
  <main>
    <div id="msg"></div>
    <div id="view"><p class="muted">読み込み中…</p></div>
  </main>
</div>
<script>
// ---- サーバー呼び出し（GASの外で開いたときは仮データで動く） ----
var IN_GAS = typeof google !== 'undefined' && google.script && google.script.run;
var demo = [{no:'E0001',name:'山田 太郎',kana:'ヤマダ タロウ',mail:'taro@example.com',dept:'開発部',type:'正社員',joined:'2025-04-01',status:'在籍',payType:'月給',base:250000,stdTime:'8:00',commute:10000,housing:10000,fixed:0,fixedName:'',shareState:'共有済み',sheetUrl:'#',folderUrl:'#',history:[]}];
function call(fn) {
  var args = [].slice.call(arguments, 1);
  return new Promise(function (ok, ng) {
    if (IN_GAS) { var r = google.script.run.withSuccessHandler(ok).withFailureHandler(ng); r[fn].apply(r, args); return; }
    setTimeout(function () {
      if (fn === 'listEmployees') ok(demo);
      else if (fn === 'getEmployee') ok(demo.filter(function (e) { return e.no === args[0]; })[0]);
      else if (fn === 'saveEmployee') { if (args[1]) demo.push(Object.assign({shareState:'入社日に共有予定',history:[]}, args[0])); ok({ok:true,message:'保存しました（仮データ）'}); }
      else if (fn === 'deleteEmployee') { demo = demo.filter(function (e) { return e.no !== args[0]; }); ok({ok:true,message:'削除しました（仮データ）'}); }
      else ok({ok:true,message:'完了（仮データ）'});
    }, 200);
  });
}

// ---- 状態 ----
var S = { list: [], q: '', filter: 'すべて', cur: null, tab: 'basic', confirm: false };
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function yen(n) { return (n || n === 0) && n !== '' ? Number(n).toLocaleString() + '円' : '—'; }
function msg(text, isErr) { $('msg').innerHTML = text ? '<div class="' + (isErr ? 'err' : 'toast') + '">' + esc(text) + '</div>' : ''; }
function fail(e) { msg('エラー：' + (e && e.message || e), true); }
function shareTag(s) { var c = s === '共有済み' ? 'ok' : (s === '共有停止' || s === '未作成' ? 'gray' : 'wait'); return '<span class="tag ' + c + '">' + esc(s || '—') + '</span>'; }

// ---- 一覧 ----
function loadList(text) {
  call('listEmployees').then(function (l) { S.list = l; showList(); if (text) msg(text); }).catch(fail);
}
function showList() {
  var q = S.q.trim();
  var rows = S.list.filter(function (e) {
    return (S.filter === 'すべて' || e.status === S.filter) && (!q || e.name.indexOf(q) >= 0 || e.no.indexOf(q) >= 0 || (e.kana || '').indexOf(q) >= 0);
  });
  var h = '<div class="row between mb"><h1>社員一覧</h1><button class="btn" onclick="showNew()">＋ 社員を登録</button></div>';
  h += '<div class="row mb"><div style="flex:1 1 260px;max-width:360px"><input id="q" placeholder="氏名・フリガナ・社員番号で検索" value="' + esc(S.q) + '" oninput="S.q=this.value;showList();this.focus()" aria-label="検索"></div>';
  ['すべて', '在籍', '休職'].forEach(function (f) { h += '<button class="pill' + (S.filter === f ? ' on' : '') + '" onclick="S.filter=\'' + f + '\';showList()">' + f + '</button>'; });
  h += '</div><div class="card tw"><table><thead><tr><th>社員番号</th><th>氏名</th><th>所属</th><th>雇用形態</th><th>入社日</th><th>在籍</th><th>住宅手当</th><th>勤怠シート</th><th></th></tr></thead><tbody>';
  rows.forEach(function (e) {
    h += '<tr><td>' + esc(e.no) + '</td><td style="font-weight:500">' + esc(e.name) + '</td><td>' + esc(e.dept) + '</td><td>' + esc(e.type) + '</td><td>' + esc(e.joined) + '</td>' +
      '<td><span class="tag ' + (e.status === '休職' ? 'wait' : 'ok') + '">' + esc(e.status) + '</span></td><td>' + yen(e.housing) + '</td><td>' + shareTag(e.shareState) + '</td>' +
      '<td><button class="out" onclick="openDetail(\'' + esc(e.no) + '\')">詳細</button></td></tr>';
  });
  if (!rows.length) h += '<tr><td colspan="9" class="muted">該当する社員はいません。</td></tr>';
  h += '</tbody></table></div><p class="muted">' + rows.length + '件を表示中</p>';
  var pos = document.activeElement && document.activeElement.id === 'q' ? $('q').selectionStart : null;
  $('view').innerHTML = h;
  if (pos !== null) { $('q').focus(); $('q').setSelectionRange(pos, pos); }
}

// ---- 入力欄 ----
function fld(label, key, v, opt) {
  opt = opt || {};
  var req = opt.req ? ' <span class="req">*</span>' : '';
  var inner;
  if (opt.list) inner = '<select id="f_' + key + '">' + opt.list.map(function (o) { return '<option' + (o === v ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select>';
  else inner = '<input id="f_' + key + '" type="' + (opt.type || 'text') + '" value="' + esc(v) + '" placeholder="' + esc(opt.ph || '') + '"' + (opt.ro ? ' readonly' : '') + '>';
  return '<label>' + label + req + inner + (opt.note ? '<small>' + opt.note + '</small>' : '') + '</label>';
}
function val(key) { var el = $('f_' + key); return el ? el.value : undefined; }
var TYPES = ['正社員', '契約社員', 'パート・アルバイト'], PAYS = ['月給', '日給', '時給'];
var HOUSING_NOTE = '在籍7か月以上の社員は 10,000 円';

function basicFields(e, isNew) {
  return fld('社員番号', 'no', e.no, { req: 1, ph: 'E0004', ro: !isNew }) + fld('氏名', 'name', e.name, { req: 1, ph: '例：佐藤 花子' }) +
    fld('フリガナ', 'kana', e.kana, { ph: 'サトウ ハナコ' }) + fld('メールアドレス', 'mail', e.mail, { req: 1, type: 'email', ph: 'hanako@example.com' }) +
    fld('所属', 'dept', e.dept, { ph: '開発部' }) + fld('雇用形態', 'type', e.type, { list: TYPES }) +
    fld('入社日', 'joined', e.joined, { req: 1, type: 'date' }) + (isNew ? '' : fld('在籍', 'status', e.status, { list: ['在籍', '休職'] }));
}
function payFields(e) {
  return fld('給与形態', 'payType', e.payType, { list: PAYS }) + fld('基本給（円）', 'base', e.base, { ph: '250000' }) +
    fld('1日の標準時間', 'stdTime', e.stdTime || '8:00', { ph: '8:00' });
}
function allowFields(e) {
  return fld('通勤手当（月額・円）', 'commute', e.commute, { ph: '10000' }) + fld('住宅手当（月額・円）', 'housing', e.housing, { ph: '0', note: HOUSING_NOTE }) +
    fld('固定手当（月額・円）', 'fixed', e.fixed, { ph: '0' }) + fld('固定手当の名前', 'fixedName', e.fixedName, { ph: '例：資格手当' });
}
function collect(base) {
  var o = Object.assign({}, base);
  ['no', 'name', 'kana', 'mail', 'dept', 'type', 'joined', 'status', 'payType', 'base', 'stdTime', 'commute', 'housing', 'fixed', 'fixedName'].forEach(function (k) {
    var v = val(k); if (v !== undefined) o[k] = v;
  });
  var hs = document.querySelectorAll('.hrow');
  if (hs.length || S.cur) o.history = [].map.call(hs, function (r) {
    var i = r.querySelectorAll('input'); return { project: i[0].value, amount: i[1].value, from: i[2].value, to: i[3].value };
  });
  return o;
}
function markErrors(list) {
  msg(list.join('　／　'), true);
  var map = { '社員番号': 'no', '氏名': 'name', 'メール': 'mail', '入社日': 'joined' };
  Object.keys(map).forEach(function (k) { var el = $('f_' + map[k]); if (el) el.classList.toggle('bad', list.some(function (m) { return m.indexOf(k) >= 0; })); });
}

// ---- 新規登録 ----
function showNew() {
  msg('');
  var h = '<button class="link" onclick="showList()">← 社員一覧へ戻る</button><h1 style="margin-bottom:6px">社員を登録</h1>' +
    '<p class="muted" style="margin:0 0 18px">登録すると勤怠シートと個人フォルダを作成し、入社日の朝に本人へ共有します。<span class="req">*</span> は必須です。</p>' +
    '<div class="card pad grid">' + basicFields({ type: '正社員' }, true) + payFields({ payType: '月給' }) + allowFields({}) + '</div>' +
    '<div class="row" style="margin-top:18px"><button class="btn" id="go" onclick="register()">登録して勤怠シートを作成</button><button class="sub" onclick="showList()">キャンセル</button></div>';
  $('view').innerHTML = h; window.scrollTo(0, 0);
}
function register() {
  var d = collect({}); delete d.history;
  $('go').disabled = true; $('go').textContent = '作成中…（10秒ほどかかります）';
  call('saveEmployee', d, true).then(function (r) {
    if (!r.ok) { $('go').disabled = false; $('go').textContent = '登録して勤怠シートを作成'; markErrors(r.errors); return; }
    S.filter = 'すべて'; loadList(r.message);
  }).catch(function (e) { $('go').disabled = false; fail(e); });
}

// ---- 詳細 ----
function openDetail(no) {
  msg(''); $('view').innerHTML = '<p class="muted">読み込み中…</p>';
  call('getEmployee', no).then(function (e) { S.cur = e; S.tab = 'basic'; S.confirm = false; showDetail(); }).catch(fail);
}
var TABS = [['basic', '基本情報'], ['pay', '給与条件'], ['allow', '手当'], ['proj', '案件・参画履歴'], ['sheet', '勤怠シート']];
function showDetail() {
  var e = S.cur;
  var h = '<button class="link" onclick="showList()">← 社員一覧へ戻る</button>' +
    '<div class="row between mb" style="align-items:flex-end"><div><div class="muted">' + esc(e.no) + '　' + esc(e.dept) + '</div><h1>' + esc(e.name) + ' <span style="font-size:14px;font-weight:400;color:#5A6170">' + esc(e.kana) + '</span></h1></div>' +
    '<div class="row"><button class="danger" onclick="S.confirm=true;showDetail()">この社員を削除</button><button class="btn" id="save" onclick="save()">変更を保存</button></div></div>';
  if (S.confirm) h += '<div class="confirm"><div style="font-weight:700;color:#8C1D18;margin-bottom:6px">' + esc(e.name) + ' さんを削除しますか？</div>' +
    '<div style="font-size:14px;color:#5A2A27;margin-bottom:12px">退職などで削除すると、社員一覧から消え、勤怠シートの本人への共有を止めます。勤怠シートと個人フォルダは「退職者」フォルダに移して残します。</div>' +
    '<div class="row"><button class="dangerFill" onclick="del()">削除する</button><button class="sub" onclick="S.confirm=false;showDetail()">キャンセル</button></div></div>';
  h += '<div class="tabs">' + TABS.map(function (t) { return '<button class="tab' + (S.tab === t[0] ? ' on' : '') + '" onclick="switchTab(\'' + t[0] + '\')">' + t[1] + '</button>'; }).join('') + '</div>';
  // 全タブを描いて、選んだタブだけ見せる（タブを切り替えても入力が消えない）
  h += pane('basic', '<div class="grid">' + basicFields(e, false) + '</div>');
  h += pane('pay', '<div class="grid">' + payFields(e) + '</div><p class="muted" style="margin:16px 0 0">給与計算は社労士が行います。ここでは社労士に渡す条件を登録します。</p>');
  h += pane('allow', '<div class="grid">' + allowFields(e) + '</div>');
  h += pane('proj', '<div class="tw"><table style="min-width:600px"><thead><tr><th>案件</th><th>インセンティブ月額（円）</th><th>参画開始</th><th>参画終了</th><th></th></tr></thead><tbody id="hbody">' +
    (e.history || []).map(hrow).join('') + '</tbody></table></div><button class="out" style="margin-top:14px" onclick="addH()">＋ 参画を追加</button>');
  h += pane('sheet', '<div style="display:flex;flex-direction:column;gap:14px">' +
    '<div><span class="muted">勤怠シート：</span>' + (e.sheetUrl ? '<a href="' + esc(e.sheetUrl) + '" target="_blank">勤怠表_' + esc(e.no) + '_' + esc(e.name) + '</a>' : '未作成') + '</div>' +
    '<div><span class="muted">個人フォルダ：</span>' + (e.folderUrl ? '<a href="' + esc(e.folderUrl) + '" target="_blank">' + esc(e.no) + '_' + esc(e.name) + '</a>' : '未作成') + '</div>' +
    '<div><span class="muted">本人への共有：</span>' + shareTag(e.shareState) + '</div>' +
    '<div><button class="sub" onclick="recreate()">勤怠シートを作り直す</button></div></div>');
  $('view').innerHTML = h;
}
function pane(k, inner) { return '<div class="card pad' + (S.tab === k ? '' : ' hide') + '" data-pane="' + k + '">' + inner + '</div>'; }
function switchTab(k) { S.tab = k; document.querySelectorAll('[data-pane]').forEach(function (p) { p.classList.toggle('hide', p.dataset.pane !== k); }); document.querySelectorAll('.tab').forEach(function (b, i) { b.classList.toggle('on', TABS[i][0] === k); }); }
function hrow(x) { x = x || {}; return '<tr class="hrow"><td><input value="' + esc(x.project) + '" placeholder="案件名"></td><td><input value="' + esc(x.amount) + '" placeholder="30000"></td><td><input type="date" value="' + esc(x.from) + '"></td><td><input type="date" value="' + esc(x.to) + '"></td><td><button class="sub" onclick="this.closest(\'tr\').remove()">削除</button></td></tr>'; }
function addH() { $('hbody').insertAdjacentHTML('beforeend', hrow()); }
function save() {
  var d = collect({ no: S.cur.no });
  $('save').disabled = true;
  call('saveEmployee', d, false).then(function (r) {
    $('save').disabled = false;
    if (!r.ok) { markErrors(r.errors); return; }
    msg(r.message); call('getEmployee', S.cur.no).then(function (e) { S.cur = e; var t = S.tab; showDetail(); switchTab(t); });
  }).catch(function (e) { $('save').disabled = false; fail(e); });
}
function del() { call('deleteEmployee', S.cur.no).then(function (r) { S.cur = null; loadList(r.message); }).catch(fail); }
function recreate() { msg('作り直しています…'); call('recreateSheet', S.cur.no).then(function (r) { msg(r.message); openDetailKeep(); }).catch(fail); }
function openDetailKeep() { call('getEmployee', S.cur.no).then(function (e) { S.cur = e; showDetail(); switchTab('sheet'); }); }

loadList();
</script>
</body>
</html>
