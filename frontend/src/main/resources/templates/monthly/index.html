<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('月次集計')}"></head>
<body>
<div class="app">
  <nav th:replace="~{fragments/layout :: nav('monthly')}"></nav>
  <main class="main">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="row between mb"><h1>月次集計</h1>
      <form class="row" th:action="@{/monthly}" method="get"><input type="month" name="ym" th:value="${ym}" style="width:auto"><button class="btn-sub">表示</button></form>
    </div>
    <div class="warn" th:if="${fake}">Google につながっていないため、仮データで動いています（どの勤怠シートも平日 9:30〜18:30 として読みます）。</div>

    <div class="card pad mb">
      <div class="muted mb">毎月の流れ（<span th:text="${ym}"></span>）</div>
      <div class="row">
        <form th:action="@{/monthly/sheets}" method="post"><input type="hidden" name="ym" th:value="${ym}"><button class="btn-outline">① 全員の勤怠シートに月のシートを作る</button></form>
        <form th:action="@{/monthly/collect}" method="post"><input type="hidden" name="ym" th:value="${ym}"><button class="btn" th:disabled="${fixed}">② 集計する</button></form>
        <a class="btn-outline" th:href="@{/monthly/csv(ym=${ym})}" th:if="${!rows.isEmpty()}">③ CSVをダウンロード</a>
        <form th:action="@{/monthly/send}" method="post" th:if="${!rows.isEmpty()}"><input type="hidden" name="ym" th:value="${ym}"><button class="btn-outline">③ 社労士へメールで送る</button></form>
        <form th:action="@{/monthly/fix}" method="post" th:if="${!rows.isEmpty() and !fixed}" onsubmit="return confirm('確定すると、この月は集計し直せなくなります。よろしいですか？')">
          <input type="hidden" name="ym" th:value="${ym}"><button class="btn-danger">④ 確定する</button></form>
      </div>
      <p class="muted" style="margin:10px 0 0">交通費・経費は、フォームの回答シートで「承認」にした分だけ入ります（「設定」で回答シートを登録）。</p>
    </div>

    <div class="card table-wrap">
      <table class="table">
        <thead><tr><th th:each="h : ${header}" th:text="${h}"></th></tr></thead>
        <tbody>
        <tr th:each="r : ${rows}"><td th:each="c : ${r}" th:text="${c}"></td></tr>
        <tr th:if="${rows.isEmpty()}"><td th:colspan="${header.size()}" class="muted">まだ集計していません。「② 集計する」を押してください。</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
</body>
</html>
